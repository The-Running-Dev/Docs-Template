name: Docs Quality

# Validates authored Markdown that the documentation site build never sees.
# Docusaurus already fails on unresolved links inside docs/, so this covers the
# rest: root Markdown such as README.md, cross-file relative links and heading
# anchors everywhere, product-name casing, and drift between a generated file
# and the source it came from.
#
# Deliberately its own workflow rather than a job appended to an existing test
# workflow. The setup script owns this file outright, so it can reinstall it to
# pick up upstream fixes without editing a file someone else wrote.
#
# Pure PowerShell, so no container is needed.

"on":
    pull_request:
        paths:
            - '**.md'
            - '.config/DocumentationRules.psd1'
            - 'build/Test-Documentation.ps1'
            - 'build/ConvertTo-DocumentationHomepage.ps1'
            - '.github/workflows/docs-quality.yml'
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

defaults:
    run:
        shell: pwsh

jobs:
    verify:
        name: Documentation links and terminology
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Validate Markdown links, terminology, and generated files
              run: ./build/Test-Documentation.ps1
