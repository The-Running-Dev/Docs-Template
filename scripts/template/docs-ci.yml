name: Docs CI

# Verify the documentation builds. Reusable and manually runnable; the caller's
# main workflow decides when to call it. No push/PR triggers.
"on":
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read
    packages: read

defaults:
    run:
        shell: pwsh

jobs:
    verify:
        name: Verify Documentation Build
        runs-on: ubuntu-latest
        # Run every step inside the published base image, which already carries
        # the template under /template with node_modules and PowerShell installed.
        container:
            image: ghcr.io/the-running-dev/docs-template:latest
            credentials:
                username: ${{ github.repository_owner }}
                password: ${{ secrets.REGISTRY_TOKEN || github.token }}

        steps:
            - name: Check out Repository
              uses: actions/checkout@v6

            - name: Build Documentation (verify)
              run: /template/scripts/docs-build.ps1 -SourceDocs ./docs -OutputPath artifacts/docs

            # Run the same archiving step docs-deploy.yml uses, so the deploy
            # path is covered before merge rather than after it. This action
            # tars the site with `tar --hard-dereference`, which fails outright
            # on an image without GNU tar; because deploy only runs on push to
            # main, such a break used to surface only once it was too late to
            # block. Uploading an artifact publishes nothing — deploy-pages
            # does that, and it stays out of this workflow.
            - name: Archive Pages Artifact (verify deploy path)
              uses: actions/upload-pages-artifact@v4
              with:
                  path: artifacts/docs
