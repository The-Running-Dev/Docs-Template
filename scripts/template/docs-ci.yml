name: Docs CI

# Verify the documentation builds. Reusable and manually runnable; the caller's
# main workflow decides when to call it. No push/PR triggers.
"on":
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read
    packages: read

defaults:
    run:
        shell: pwsh

jobs:
    verify:
        name: Verify Documentation Build
        runs-on: ubuntu-latest
        # Run every step inside the published base image, which already carries
        # the template under /template with node_modules and PowerShell installed.
        container:
            image: ghcr.io/the-running-dev/docs-template:latest
            credentials:
                username: ${{ github.repository_owner }}
                password: ${{ secrets.REGISTRY_TOKEN || github.token }}

        steps:
            - name: Check out Repository
              uses: actions/checkout@v6

            - name: Build Documentation (verify)
              run: /template/scripts/docs-build.ps1 -SourceDocs ./docs -OutputPath artifacts/docs
