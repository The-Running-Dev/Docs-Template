name: Docs

# Trigger-carrying entry point for the documentation workflows. docs-ci.yml and
# docs-deploy.yml are installed from Docusaurus-Template and declare
# workflow_call only, so without this file nothing runs them. Keeping the
# triggers here lets those two stay byte-identical to the template, so the setup
# script can reinstall them to pick up upstream fixes.

"on":
    pull_request:
        paths:
            - '.github/workflows/docs.yml'
            - '.github/workflows/docs-ci.yml'
            - '.github/workflows/docs-deploy.yml'
            - 'docs/**'
            - 'docs.ps1'
            - 'README.md'
    push:
        branches:
            - main
        paths:
            - '.github/workflows/docs.yml'
            - '.github/workflows/docs-ci.yml'
            - '.github/workflows/docs-deploy.yml'
            - 'docs/**'
            - 'docs.ps1'
            - 'README.md'
    workflow_dispatch:

# A called workflow can never hold more permissions than its caller, so these
# cover the superset docs-deploy.yml requires.
permissions:
    contents: read
    packages: read
    pages: write
    id-token: write

jobs:
    verify:
        name: Verify documentation
        if: github.event_name != 'push'
        # secrets: inherit passes REGISTRY_TOKEN through for the base image
        # pull; a reusable workflow receives no secrets without it.
        uses: ./.github/workflows/docs-ci.yml
        secrets: inherit

    deploy:
        name: Deploy documentation
        if: github.event_name == 'push'
        uses: ./.github/workflows/docs-deploy.yml
        secrets: inherit
