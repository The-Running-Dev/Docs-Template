# Pre-build configuration settings
preBuild:
  # Project root directory, relative to the project root directory
  projectRoot: ../
  overwriteExistingFiles: true
  copyMarkdownFromProjectRoot: false
  generateNavBarForPages: false
  defaultTheme: agent

site:
  title: Docusaurus Template
  tagline: Template for Documentation Sites
  url: http://docs-template.subzerodev.com/
  baseUrl: /
  organizationName: The-Running-Dev
  projectName: Docusaurus Template

theme:
  navbar:
    title: Template
    logo:
      alt: Template
      src: img/logo.svg

features:
  giscusComments: true
  gitHubLinks: true
  navBarLinks: true
  badges: true
  themeSwitcher: true
  textSizeSwitcher: true
  readerMode: true
  versionDisplay: true
  cvPage: true
  portfolioPage: true
  portfolioPageAsIndex: false
  projectsPage: true
  dataCaching: true
  adminUI: false

# HTTP sources for projectsPage, portfolioPage, and cvPage now live in
# config/sources.public.yml (ids: projects, portfolio, cv), read through
# subzerodev-data-json rather than a `.source` key here.