name: Docs Build Common

on:
  workflow_call:
    inputs:
      docs-script:
        description: Path to the docs build helper script.
        required: false
        type: string
        default: ./scripts/docs.ps1
      base-image:
        description: Base docs template image to verify.
        required: false
        type: string
        default: ghcr.io/the-running-dev/docs-template:latest
      image-tag-prefix:
        description: Local docker image tag prefix.
        required: false
        type: string
        default: docs-site
      output-path:
        description: Directory to copy static build artifacts into.
        required: false
        type: string
        default: artifacts/docs

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN || github.token }}

      - name: Verify Documentation Template Image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseImage = '${{ inputs.base-image }}'

          & docker buildx imagetools inspect $baseImage

          if ($LASTEXITCODE -ne 0) {
            throw "Documentation Template Image '$baseImage' does not exist or is not accessible."
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Documentation Image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = '${{ inputs.image-tag-prefix }}:${{ github.sha }}'
          & '${{ inputs.docs-script }}' -BuildOnly -Tag $image

      - name: Build and Copy Static Site
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = '${{ inputs.image-tag-prefix }}:${{ github.sha }}'
          $container = '${{ inputs.image-tag-prefix }}-build'
          $output = './${{ inputs.output-path }}'

          & docker create --name $container $image sh -c 'pnpm run build' | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Creating the documentation build container failed with exit code $LASTEXITCODE."
          }

          & docker start --attach $container
          if ($LASTEXITCODE -ne 0) {
            throw "Building the static documentation failed with exit code $LASTEXITCODE."
          }

          New-Item -ItemType Directory -Path $output -Force | Out-Null
          & docker cp "${container}:/template/artifacts/." $output
          if ($LASTEXITCODE -ne 0) {
            throw "Copying the static documentation failed with exit code $LASTEXITCODE."
          }

      - name: Remove Documentation Container
        if: ${{ always() }}
        shell: pwsh
        run: |
          $containerName = '${{ inputs.image-tag-prefix }}-build'
          $container = docker ps --all `
            --filter "name=^/$containerName$" `
            --format '{{.Names}}'

          if ($container) {
            & docker rm --force $containerName
          }

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ inputs.output-path }}

  deploy:
    name: Deploy Documentation
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4